name: Build CDDA iOS IPA
on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'false' 

      - name: Manually Initialize Mandatory Engine Submodules
        run: |
          # De-register the broken worktrees so Git doesn't check them
          git config --global --unset-all submodule.worktree/Cataclysm-BN.url || true
          git config --global --unset-all submodule.worktree/Cataclysm-DDA.url || true
          
          # Force synchronization and grab the core .xcconfig/framework submodules
          git submodule init
          git submodule update --recursive --force

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build Xcode Project (0.F Version)
        run: |
          xcodebuild -project CDDA.xcodeproj \
                     -scheme CDDA0F \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Cataclysm_0F.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-0F-iOS-IPA
          path: Cataclysm_0F.ipa






  
