name: Build CDDA iOS IPA
on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'false' 

      - name: Clean and Reconstruct Valid Submodules Manually
        run: |
          # 1. Kill the broken configurations entirely
          rm -f .gitmodules
          rm -rf .git/modules
          
          # 2. Manually add back the critical engine Libraries using HTTPS URLs
          # This completely bypasses SSH keys and broken worktree setups
          git submodule add --force https://github.com Libraries/CDDA-Paywall || true
          git submodule add --force https://github.com Libraries/JSController || true
          git submodule add --force https://github.com Libraries/SDL || true
          git submodule add --force https://github.com Libraries/SDL_image || true
          git submodule add --force https://github.com Libraries/SDL_mixer || true
          git submodule add --force https://github.com Libraries/SDL_ttf || true
          
          # 3. Initialize and pull the downloaded libraries
          git submodule update --init --recursive --force

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build Xcode Project (0.F Version)
        run: |
          xcodebuild -project CDDA.xcodeproj \
                     -scheme CDDA0F \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Cataclysm_0F.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-0F-iOS-IPA
          path: Cataclysm_0F.ipa















  
