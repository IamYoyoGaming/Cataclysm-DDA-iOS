name: Build CDDA iOS IPA
on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Disabling 'recursive' stops Git from crashing over the worktree folders
          submodules: 'false' 

      - name: Fetch Core Repository Submodules Manually
        run: |
          # Only initialize the base submodules needed for the environment wrapper
          git submodule update --init --remote --recursive submodule/ || true

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build Xcode Project
        run: |
          xcodebuild -project CDDA.xcodeproj \
                     -scheme CDDA \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/CDDA.app Payload/
          zip -r Cataclysm_0F.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-0F-iOS-IPA
          path: Cataclysm_0F.ipa

  
