name: Build CDDA iOS IPA
on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'false' 

      - name: Fetch Core Repository Submodules Manually
        run: |
          git submodule update --init --remote --recursive submodule/ || true

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Diagnostic - List Project Schemes
        run: |
          # This forces Xcode to print the exact schemes available so we see them in the logs
          xcodebuild -project CDDA.xcodeproj -list

      - name: Build Xcode Project
        run: |
          # Building the workspace target directly while disabling code signing requirements
          xcodebuild -project CDDA.xcodeproj \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Finds the compiled .app file dynamically regardless of the target folder name
          cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Cataclysm_0F.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-0F-iOS-IPA
          path: Cataclysm_0F.ipa


  
